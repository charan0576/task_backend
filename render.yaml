# Render Blueprint: the Advent Tech API (FastAPI + Remotion renderer + headless Chromium) in one Docker service.
# The React studio is NOT here; it is deployed separately on Vercel from the frontend/ folder.
# Values marked sync: false are entered in the Render dashboard the first time (never committed).
services:
  - type: web
    name: advent-tech-api
    runtime: docker
    # Video rendering needs ~2 GB RAM, and persistent disks need a paid plan. Do not use "free".
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: advent-data
      mountPath: /data          # the Dockerfile sets DATA_DIR=/data to match
      sizeGB: 10
    envVars:
      - key: PUBLIC_BASE_URL    # the Render URL, e.g. https://advent-tech-api.onrender.com
        sync: false
      - key: FRONTEND_URL       # the Vercel URL, e.g. https://advent-tech-studio.vercel.app
        sync: false
      - key: CORS_ORIGIN_REGEX  # optional: allow Vercel preview URLs too
        sync: false
      - key: GEMINI_API_KEY     # optional: AI-written storyline
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
